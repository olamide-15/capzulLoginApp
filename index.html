<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div id="container">
        <div class="formImg">
            <h1>Social media shared today,tomorrow or by location</h1>

            <!-- <div class="imageCir"> -->
            <img  class="phoneImg" src="./images/Imgs.png" alt="phone">

            <!-- </div> -->
            <img class="dotImg" src="images/Slider dots.png" alt="dots">
        </div>

        <!-- login form -->
         <div class="formwrapper">
            <img src="images/Logo.png" alt="logo">

            <div class="formtitle">
                <h2>Create account</h2>
                <p>For business,band or celebrity</p>
            </div>

            <form>
                <div class="forminputwrapper"> 
                    <div class="inputcard">
                        <label>First name</label>
                        <input type="text">
                    </div>

                    <div class="inputcard">
                        <label>Last name</label>
                    <input type="text">
                    </div>
                </div>

                <div class="forminputwrapper">
                    <div class="inputcard">
                        <label>Email or phone numder</label>
                        <input type="text">
                    </div>

                    <div class="inputcard">
                        <label>Date of birth(MM/DD/YY) </label>

                        <div class="dob">
                             <input class="inputDob" type="datetime">
                             <i class="fa fa-calendar" aria-hidden="true"></i>
                        </div>
                    </div>
                </div>

                <div class="forminputwrapper">
                    <div class="inputcard">
                        <label>Password</label>
                        <input type="password">
                    </div>
                    
                    <div class="inputcard">
                       <label>Confirm password</label>
                    <input type="password">
                    </div>
                </div>

                <div class="pwdlink">
                    <h5><input type="checkbox">Remember me</h5>

                    <a href="#">Forget password</a>
                </div>

                <p class="box2">
                    <input type="checkbox">i agree to all the <a href="#">Terms</a> and <a href="#"> Private Policy</a> 
                </p>

                <div class="btngroup">
                    <button>Create account</button>
                    <button>
                        <img src="images/goggle-cazlog.png" alt="goggle" width="20" height="20">
                        sign-in with goggle
                    </button>
                </div>

                <p class="lPara" style="text-align: center;">Don't have an account <a href="#">Log in</a></p>

                <div class="btngroup1">
                    <img src="./images/Google Play Badge.png" alt="goggle play">

                    <img src="./images/app store.png" alt="playstore">
                </div>
            </form>
            </div>
         </div>
    </div>
</body>
</html>
